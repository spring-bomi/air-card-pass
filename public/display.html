<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>메인 전광판 - 에어 카드 패스</title>
    <style>
        body { background-color: #111; color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; overflow: hidden; }
        
        #playerListWrapper { position: absolute; top: 30px; width: 90%; text-align: center; }
        #playerCountTitle { font-size: 24px; color: #f1c40f; margin-bottom: 15px; font-weight: bold; }
        #playerTags { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
        .name-tag { background-color: #3498db; padding: 8px 15px; border-radius: 20px; font-size: 18px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }

        /* ⭐ 새로 추가된 튜토리얼 박스 스타일 */
        #tutorialBox {
            background: rgba(255, 255, 255, 0.1);
            border: 2px dashed #f1c40f;
            border-radius: 15px;
            padding: 20px 30px;
            margin-bottom: 30px;
            text-align: center;
            max-width: 700px;
            backdrop-filter: blur(5px);
        }
        .tutorial-title { color: #f1c40f; font-size: 24px; font-weight: bold; margin-bottom: 15px; }
        .tutorial-text { color: #ecf0f1; font-size: 20px; line-height: 1.6; margin: 5px 0; }
        .highlight { color: #e74c3c; font-weight: bold; background: rgba(231, 76, 60, 0.2); padding: 2px 8px; border-radius: 5px;}

        #timer { font-size: 15rem; font-weight: bold; transition: color 0.5s ease, transform 0.5s ease; margin-top: 20px; }
        
        .blind { opacity: 0.5; color: #f1c40f; text-shadow: 0 0 20px #f1c40f; } 
        .danger { opacity: 1 !important; color: #ff3333; transform: scale(1.2); } 
        
        #startBtn { padding: 15px 40px; font-size: 26px; cursor: pointer; background-color: #e74c3c; color: white; border: none; border-radius: 10px; font-weight: bold; box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4); margin-bottom: -30px; z-index: 50;}
        #startBtn:hover { background-color: #c0392b; }
    </style>
</head>
<body>

    <div id="playerListWrapper">
        <div id="playerCountTitle">현재 접속 인원: 0명</div>
        <div id="playerTags"></div>
    </div>

    <div id="tutorialBox">
        <div class="tutorial-title">📖 게임 방법 📖</div>
        <div class="tutorial-text">타이머가 0이 되어 폭탄이 터지기 전에 다른 사람에게 재빨리 넘기세요!</div>
        <div class="tutorial-text">카메라에 손을 비추고, <span class="highlight">엄지와 검지로 꼬집어</span> 폭탄을 잡은 뒤<br><span class="highlight">옆으로 휙 스와이프하며 손을 펴서</span> 던지세요.</div>
    </div>

    <button id="startBtn">🚨 게임 시작 🚨</button>
    <div id="timer">30</div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const timerDiv = document.getElementById('timer');
        const startBtn = document.getElementById('startBtn');
        const playerCountTitle = document.getElementById('playerCountTitle');
        const playerTags = document.getElementById('playerTags');
        const tutorialBox = document.getElementById('tutorialBox'); // 튜토리얼 박스 가져오기

        socket.emit('registerDisplay');

        socket.on('updatePlayerList', (list) => {
            playerCountTitle.innerText = `현재 접속 인원: ${list.length}명 대기 중!`;
            playerTags.innerHTML = list.map(name => `<div class="name-tag">${name}</div>`).join('');
        });

        startBtn.addEventListener('click', () => {
            if (playerTags.children.length === 0) {
                alert("입장한 플레이어가 없습니다!\n최소 1명 이상 접속한 후에 시작해주세요.");
                return;
            }
            socket.emit('startGame');
            startBtn.style.display = 'none';
            tutorialBox.style.display = 'none'; // ⭐ 게임 시작 시 설명서 숨김
        });

        socket.on('preCountdown', (count) => {
            timerDiv.innerText = count;
            timerDiv.style.fontSize = "15rem";
            timerDiv.style.color = "#f1c40f";
            timerDiv.classList.remove('blind', 'danger');
        });

        socket.on('timerUpdate', (timeLeft) => {
            if (timeLeft <= 25 && timeLeft > 3) {
                timerDiv.innerText = "???";
                timerDiv.classList.add('blind');
            } 
            else if (timeLeft <= 3 && timeLeft > 0) {
                timerDiv.innerText = timeLeft;
                timerDiv.classList.remove('blind');
                timerDiv.classList.add('danger');
            } else {
                timerDiv.innerText = timeLeft;
                timerDiv.classList.remove('blind');
                timerDiv.classList.remove('danger');
            }
        });

        socket.on('explode', () => {
            timerDiv.innerText = "💥펑!!💥";
            timerDiv.style.fontSize = "10rem";
            timerDiv.classList.remove('danger');
            timerDiv.style.color = "orange";
            
            setTimeout(() => {
                startBtn.style.display = 'block'; 
                tutorialBox.style.display = 'block'; // ⭐ 라운드 종료 후 대기실로 돌아오면 설명서 다시 표시
                timerDiv.innerText = "30";
                timerDiv.style.fontSize = "15rem";
                timerDiv.style.color = "white";
            }, 5000);
        });
    </script>
</body>
</html>
