<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>메인 전광판 - 에어 카드 패스</title>
    <style>
        body { background-color: #111; color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; overflow: hidden; }
        
        /* 닉네임 리스트 표시 영역 */
        #playerListWrapper { position: absolute; top: 30px; width: 90%; text-align: center; }
        #playerCountTitle { font-size: 24px; color: #f1c40f; margin-bottom: 15px; font-weight: bold; }
        #playerTags { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
        .name-tag { background-color: #3498db; padding: 8px 15px; border-radius: 20px; font-size: 18px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }

        #timer { font-size: 15rem; font-weight: bold; transition: opacity 2s ease, color 1s ease, transform 0.5s ease; margin-top: 50px; }
        .blind { opacity: 0; } 
        .danger { opacity: 1 !important; color: #ff3333; transform: scale(1.2); } 
        
        #startBtn { padding: 15px 40px; font-size: 26px; cursor: pointer; background-color: #e74c3c; color: white; border: none; border-radius: 10px; font-weight: bold; box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4); margin-bottom: -50px; z-index: 50;}
        #startBtn:hover { background-color: #c0392b; }
    </style>
</head>
<body>

    <div id="playerListWrapper">
        <div id="playerCountTitle">현재 접속 인원: 0명</div>
        <div id="playerTags"></div>
    </div>

    <button id="startBtn">🚨 게임 시작 🚨</button>
    <div id="timer">30</div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const timerDiv = document.getElementById('timer');
        const startBtn = document.getElementById('startBtn');
        const playerCountTitle = document.getElementById('playerCountTitle');
        const playerTags = document.getElementById('playerTags');

        // 접속하자마자 이 화면은 '전광판(DISPLAY)'이라고 서버에 신고
        socket.emit('registerDisplay');

        // 플레이어 닉네임 명단 수신
        socket.on('updatePlayerList', (list) => {
            playerCountTitle.innerText = `현재 접속 인원: ${list.length}명 대기 중!`;
            // 배열에 있는 이름들을 예쁜 태그로 만들어 화면에 표시
            playerTags.innerHTML = list.map(name => `<div class="name-tag">${name}</div>`).join('');
        });

        // ⭐ [수정된 부분] 0명일 때 시작 방지 로직 추가
        startBtn.addEventListener('click', () => {
            if (playerTags.children.length === 0) {
                alert("입장한 플레이어가 없습니다!\n최소 1명 이상 접속한 후에 시작해주세요.");
                return;
            }
            socket.emit('startGame');
            startBtn.style.display = 'none';
        });

        socket.on('timerUpdate', (timeLeft) => {
            timerDiv.innerText = timeLeft;

            if (timeLeft <= 25 && timeLeft > 3) {
                timerDiv.classList.add('blind');
            } 
            else if (timeLeft <= 3 && timeLeft > 0) {
                timerDiv.classList.remove('blind');
                timerDiv.classList.add('danger');
            }
        });

        socket.on('explode', () => {
            timerDiv.innerText = "💥펑!!💥";
            timerDiv.style.fontSize = "10rem";
            timerDiv.classList.remove('danger');
            timerDiv.style.color = "orange";
            
            setTimeout(() => {
                startBtn.style.display = 'block'; 
                timerDiv.innerText = "30";
                timerDiv.style.fontSize = "15rem";
                timerDiv.style.color = "white";
            }, 5000);
        });
    </script>
</body>
</html>
