<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>메인 전광판 - 에어 카드 패스</title>
    <style>
        body { background-color: #111; color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; overflow: hidden; }
        
        /* 추가된 접속 인원 표시 스타일 */
        #playerCount { position: absolute; top: 20px; font-size: 24px; color: #2ecc71; font-weight: bold; }
        
        #timer {
            font-size: 15rem;
            font-weight: bold;
            transition: opacity 2s ease, color 1s ease, transform 0.5s ease;
        }
        .blind { opacity: 0; } 
        .danger { opacity: 1 !important; color: #ff3333; transform: scale(1.2); } 
        #startBtn { padding: 15px 30px; font-size: 24px; cursor: pointer; margin-bottom: 50px; background-color: #3498db; color: white; border: none; border-radius: 10px; font-weight: bold; }
        #startBtn:hover { background-color: #2980b9; }
    </style>
</head>
<body>

    <div id="playerCount">현재 접속: 0명 대기 중</div>

    <button id="startBtn">게임 시작</button>
    <div id="timer">30</div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const timerDiv = document.getElementById('timer');
        const startBtn = document.getElementById('startBtn');
        const countDiv = document.getElementById('playerCount');

        // 서버로부터 접속자 수 업데이트 받기
        socket.on('updatePlayers', (count) => {
            // 전광판(디스플레이) 자신도 1명으로 카운트되므로 1을 빼줍니다.
            let actualPlayers = count - 1; 
            if(actualPlayers < 0) actualPlayers = 0;
            countDiv.innerText = `현재 접속 플레이어: ${actualPlayers}명`;
        });

        startBtn.addEventListener('click', () => {
            socket.emit('startGame');
            startBtn.style.display = 'none';
        });

        socket.on('timerUpdate', (timeLeft) => {
            timerDiv.innerText = timeLeft;

            if (timeLeft <= 25 && timeLeft > 3) {
                timerDiv.classList.add('blind');
            } 
            else if (timeLeft <= 3 && timeLeft > 0) {
                timerDiv.classList.remove('blind');
                timerDiv.classList.add('danger');
            }
        });

        socket.on('explode', () => {
            timerDiv.innerText = "💥펑!!💥";
            timerDiv.style.fontSize = "10rem";
            timerDiv.classList.remove('danger');
            timerDiv.style.color = "orange";
            
            setTimeout(() => {
                startBtn.style.display = 'block'; 
                timerDiv.innerText = "30";
                timerDiv.style.fontSize = "15rem";
                timerDiv.style.color = "white";
            }, 5000);
        });
    </script>
</body>
</html>
