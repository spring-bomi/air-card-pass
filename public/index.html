<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>에어 카드 패스 - 플레이어 (핸드 트래킹 적용)</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #2c3e50; touch-action: none; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; }
        
        #loginScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #34495e; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        #nicknameInput { padding: 15px; font-size: 20px; border-radius: 10px; border: none; margin-bottom: 20px; text-align: center; width: 70%; max-width: 300px; font-weight: bold; }
        #joinBtn { padding: 15px 40px; font-size: 20px; background-color: #e74c3c; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        
        #bomb {
            width: 150px; height: 220px;
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            border-radius: 15px; position: absolute;
            display: none; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            transition: transform 0.1s;
            display: flex; justify-content: center; align-items: center;
            color: white; font-size: 24px; font-weight: bold;
            z-index: 10;
            cursor: grab;
        }
        #bomb:active { cursor: grabbing; }
        
        .grabbed { transform: scale(0.9); box-shadow: 0 5px 10px rgba(0,0,0,0.3) !important; }
        .dropped { transition: top 0.5s ease-in !important; top: 120% !important; }

        /* 웹캠 화면 스타일 (우측 상단) */
        #webcam {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 160px;
            height: 120px;
            border-radius: 10px;
            z-index: 50;
            transform: scaleX(-1); /* 거울 모드 */
            border: 3px solid #f1c40f;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            background-color: #000;
        }
    </style>
</head>
<body>

    <video id="webcam" autoplay playsinline></video>

    <div id="loginScreen">
        <h1 style="color: white; margin-bottom: 30px;">에어 카드 패스 💣</h1>
        <input type="text" id="nicknameInput" placeholder="당신의 이름은?">
        <button id="joinBtn">입장하기</button>
    </div>

    <h2 id="status" style="color: white; position: absolute; top: 20px; text-align: center; width: 90%; font-size: 20px;"></h2>
    <div id="bomb">💣 폭탄</div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const bomb = document.getElementById('bomb');
        const status = document.getElementById('status');
        
        const loginScreen = document.getElementById('loginScreen');
        const nicknameInput = document.getElementById('nicknameInput');
        const joinBtn = document.getElementById('joinBtn');
        const videoElement = document.getElementById('webcam');

        let isDragging = false;
        let startX, currentX, startTime;
        let isMyTurn = false;

        // 입장 버튼 로직
        joinBtn.addEventListener('click', () => {
            const nickname = nicknameInput.value.trim();
            if(nickname) {
                socket.emit('setNickname', nickname);
                loginScreen.style.display = 'none'; 
                status.innerText = `${nickname}님, 대기 중...`;
                startCamera(); // 입장 후 카메라 실행
            } else {
                alert("이름을 꼭 입력해주세요!");
            }
        });

        socket.on('receiveBomb', () => {
            isMyTurn = true;
            status.innerText = "빨리 옆으로 던지세요! (손으로 꼬집어서 스와이프!)";
            status.style.color = "white";
            bomb.style.backgroundColor = "";
            bomb.innerText = "💣 폭탄";
            bomb.style.display = 'flex';
            bomb.style.left = '-150px'; 
            bomb.style.top = '50%';
            bomb.style.transform = 'translateY(-50%)';
            
            setTimeout(() => {
                bomb.style.transition = 'left 0.3s ease-out';
                bomb.style.left = 'calc(50% - 75px)'; 
            }, 10);
        });

        // ----------------------------------------------------
        // [1] 마우스 & 터치 드래그 로직 (기존 로직 유지)
        // ----------------------------------------------------
        function getClientX(e) {
            return e.touches ? e.touches[0].clientX : e.clientX;
        }

        function handleStart(e) {
            if (!isMyTurn) return;
            isDragging = true;
            bomb.classList.add('grabbed');
            bomb.style.transition = 'none'; 
            startX = getClientX(e);
            startTime = Date.now();
        }

        function handleMove(e) {
            if (!isDragging) return;
            currentX = getClientX(e);
            let moveX = currentX - startX;
            bomb.style.left = `calc(50% - 75px + ${moveX}px)`;
        }

        function handleEnd(e) {
            if (!isDragging) return;
            processThrow();
        }

        bomb.addEventListener('touchstart', handleStart, {passive: false});
        bomb.addEventListener('touchmove', handleMove, {passive: false});
        bomb.addEventListener('touchend', handleEnd);
        bomb.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);

        // ----------------------------------------------------
        // [2] 핸드 트래킹 (MediaPipe) 로직
        // ----------------------------------------------------
        function getDistance(point1, point2) {
            // 두 랜드마크(점) 사이의 유클리디안 거리 계산
            return Math.sqrt(Math.pow(point1.x - point2.x, 2) + Math.pow(point1.y - point2.y, 2));
        }

        function startCamera() {
            const hands = new Hands({locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
            }});

            hands.setOptions({
                maxNumHands: 1, // 연산량 최적화를 위해 한 손만 인식
                modelComplexity: 1,
                minDetectionConfidence: 0.7,
                minTrackingConfidence: 0.7
            });

            hands.onResults((results) => {
                if (!isMyTurn) return;

                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const landmarks = results.multiHandLandmarks[0];
                    
                    // 4번: 엄지 끝, 8번: 검지 끝
                    const thumbTip = landmarks[4];
                    const indexTip = landmarks[8];
                    
                    // 거울 모드이므로 방향 반전 처리
                    const trackedX = (1 - indexTip.x) * window.innerWidth;
                    
                    // 엄지와 검지 사이의 거리 (0.06 미만이면 꼬집은 것으로 판정)
                    const pinchDistance = getDistance(thumbTip, indexTip);
                    const isPinching = pinchDistance < 0.06;

                    if (isPinching && !isDragging) {
                        // 🟢 잡기 시작 (허공에서 꼬집음)
                        isDragging = true;
                        bomb.classList.add('grabbed');
                        bomb.style.transition = 'none';
                        startX = trackedX;
                        startTime = Date.now();
                    } 
                    else if (isPinching && isDragging) {
                        // 🟢 드래그 중 (꼬집은 상태로 이동)
                        currentX = trackedX;
                        // 민감도를 높이기 위해 이동량에 1.5배 가중치 부여
                        let moveX = (currentX - startX) * 1.5; 
                        bomb.style.left = `calc(50% - 75px + ${moveX}px)`;
                    } 
                    else if (!isPinching && isDragging) {
                        // 🟢 놓기 (손가락을 폄)
                        processThrow();
                    }
                }
            });

            const camera = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({image: videoElement});
                },
                width: 640,
                height: 480
            });
            camera.start();
        }

        // ----------------------------------------------------
        // [3] 공통 던지기 판정 로직
        // ----------------------------------------------------
        function processThrow() {
            isDragging = false;
            bomb.classList.remove('grabbed');

            let endTime = Date.now();
            if(currentX === undefined) currentX = startX; 
            
            let distanceX = currentX - startX;
            let timeElapsed = endTime - startTime;
            let velocityX = distanceX / timeElapsed; 

            // 던지기 판정: 마우스와 손 인식의 감도 차이를 커버할 수 있도록 설정
            if (velocityX > 0.4 && distanceX > 50) {
                bomb.style.transition = 'left 0.2s ease-in';
                bomb.style.left = '150%'; 
                setTimeout(() => {
                    bomb.style.display = 'none';
                    isMyTurn = false;
                    status.innerText = "휴, 살았다!";
                    socket.emit('throwBomb'); 
                }, 200);
            } else {
                status.innerText = "앗! 카드를 떨어뜨렸습니다!";
                bomb.classList.add('dropped');
                setTimeout(() => {
                    bomb.classList.remove('dropped');
                    bomb.style.left = 'calc(50% - 75px)';
                    bomb.style.top = '50%';
                    status.innerText = "다시 주웠습니다! 빨리 던지세요!";
                }, 1500); 
            }
            currentX = undefined;
        }

        // 폭발 로직
        socket.on('explode', () => {
            if (isMyTurn) {
                status.innerText = "💥 으악! 내가 걸렸다! (벌칙 당첨)";
                status.style.color = "#ff3333";
                status.style.fontSize = "24px";
                bomb.style.backgroundColor = "black";
                bomb.innerText = "💀";
                bomb.classList.remove('grabbed', 'dropped');
                bomb.style.left = 'calc(50% - 75px)';
                bomb.style.top = '50%';
                isDragging = false;
            } else {
                status.innerText = "휴~ 누군가 터졌습니다!";
                bomb.style.display = 'none';
            }
        });
    </script>
</body>
</html>
